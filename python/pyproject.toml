[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "racing_rl"
version = "0.6.0"
description = "Custom TCP bridge (M3) and PyTorch PPO (M4/M5) for the Unity racing environment"
requires-python = ">=3.10"
dependencies = ["numpy>=2", "gymnasium>=1.1", "onnxruntime", "onnx", "pyyaml", "torch>=2.2"]  # torch: CPU wheel (C0.1)

[project.optional-dependencies]
test = ["pytest"]
train = ["tensorboard", "matplotlib"]

[tool.setuptools.packages.find]
include = ["racing_rl*"]

[tool.setuptools.package-data]
"racing_rl.bridge" = ["track_catalog.json"]  # M6: exported from Unity (Racing/Tracks/Export Track Catalog (M6))

[tool.pytest.ini_options]
testpaths = ["tests", "racing_rl/rl/tests"]
addopts = '-m "not slow"'
markers = [
    "unity: needs the Unity bridge player (Builds/RaceEnv/RaceEnv.exe)",
    "slow: long training runs (M4 DoD 9, Pendulum 1M steps); run with -m slow",
]

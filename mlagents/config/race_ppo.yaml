# M2 ML-Agents PPO baseline (docs/milestones/M2_baseline_reward.md). Behavior name must match RaceAgent.Behavior.
behaviors:
  RaceCar:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1.0e7
    time_horizon: 128
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 10
engine_settings:
  time_scale: 20
  target_frame_rate: -1
  no_graphics: true
torch_settings:
  device: cpu
